[project]
name = "billing-service"
version = "0.1.0"
description = "Facturas de la serie: bills por usuario, autenticado vía el IdP (capítulo 6, formato FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx2>=0.1",
    "microservices-observability",
    "microservices-user-service-client",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
microservices-observability = { path = "../packages/microservices-observability", editable = true }
microservices-user-service-client = { path = "../packages/microservices-user-service-client", editable = true }
