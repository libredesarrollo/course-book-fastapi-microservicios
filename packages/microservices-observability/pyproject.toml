[project]
name = "microservices-observability"
version = "0.1.0"
description = "Correlation ID, health check y logs con contexto para microservicios FastAPI (capítulo 5)"
requires-python = ">=3.13"
dependencies = [
    "starlette>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]
