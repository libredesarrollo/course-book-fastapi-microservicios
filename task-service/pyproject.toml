[project]
name = "task-service"
version = "0.1.0"
description = "Tareas de la serie: CRUD por usuario, autenticado vía el IdP (capítulo 1, formato FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx2>=0.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
