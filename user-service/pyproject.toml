[project]
name = "user-service"
version = "0.1.0"
description = "IdP de la serie: usuarios y tokens opacos que caducan (capítulo 1, formato FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "email-validator>=2.0",
    "microservices-observability",
    "pyjwt>=2.8",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx2>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
microservices-observability = { path = "../packages/microservices-observability", editable = true }
